general_settings:
  master_key: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
  database_url: ${DATABASE_URL}
  otel: false
  custom_auth: false
  max_request_size_mb: 100
  max_response_size_mb: 100

router_settings:
  num_retries: 2
  timeout: 600
  routing_strategy: "usage-based"
  allowed_fails: 3
  cooldown_time: 60
  enable_pre_call_checks: true
  fallback_strategy: "exponential_backoff"

model_list:
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o-2024-11-20
      api_key: ${OPENAI_API_KEY}
      rpm: 500
      tpm: 80000
      max_tokens: 16384
      temperature: 0.7
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: true
      supports_tool_actions: true
      cost_per_token_input: 0.0000025
      cost_per_token_output: 0.00001

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini-2024-07-18
      api_key: ${OPENAI_API_KEY}
      rpm: 1000
      tpm: 200000
      max_tokens: 16384
      temperature: 0.7
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: true
      supports_tool_actions: true
      cost_per_token_input: 0.00000015
      cost_per_token_output: 0.0000006

  - model_name: claude-sonnet-4
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: ${ANTHROPIC_API_KEY}
      rpm: 200
      tpm: 40000
      max_tokens: 8192
      temperature: 0.7
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: true
      supports_tool_actions: true
      cost_per_token_input: 0.000003
      cost_per_token_output: 0.000015

  - model_name: claude-haiku-3-5
    litellm_params:
      model: anthropic/claude-3-5-haiku-20241022
      api_key: ${ANTHROPIC_API_KEY}
      rpm: 500
      tpm: 100000
      max_tokens: 8192
      temperature: 0.7
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: true
      supports_tool_actions: true
      cost_per_token_input: 0.0000008
      cost_per_token_output: 0.000004

  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o-2024-08-06
      api_key: ${OPENAI_API_KEY}
      rpm: 500
      tpm: 80000
      max_tokens: 16384
      temperature: 0.7
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: true
      supports_tool_actions: true
      fallbacks:
        - claude-sonnet-4
      cost_per_token_input: 0.0000025
      cost_per_token_output: 0.00001

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini-2024-07-18
      api_key: ${OPENAI_API_KEY}
      rpm: 1000
      tpm: 200000
      max_tokens: 16384
      temperature: 0.7
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: true
      supports_tool_actions: true
      fallbacks:
        - claude-haiku-3-5
      cost_per_token_input: 0.00000015
      cost_per_token_output: 0.0000006

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 600
  max_budget: 1000
  budget_duration: 30d
  cache: true
  cache_params:
    type: redis
    ttl: 3600
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  service_callback: ["langfuse"]
  langfuse_public_key: ${LANGFUSE_PUBLIC_KEY:-pk-lf-00000000-0000-0000-0000-000000000000}
  langfuse_secret: ${LANGFUSE_SECRET_KEY:-sk-lf-00000000-0000-0000-0000-000000000000}
  langfuse_host: ${LANGFUSE_URL:-http://langfuse:3000}
