apiVersion: v1
kind: Service
metadata:
  name: {{ include "agenticos.fullname" . }}-frontend
  labels:
    {{- include "agenticos.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    {{- include "agenticos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
