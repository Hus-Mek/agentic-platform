apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agenticos.fullname" . }}-secrets
  labels:
    {{- include "agenticos.labels" . | nindent 4 }}
type: Opaque
data:
  LLM_API_KEY: {{ .Values.env.LLM_API_KEY | b64enc | quote }}
  PORTKEY_API_KEY: {{ .Values.env.PORTKEY_API_KEY | b64enc | quote }}
  JWT_SECRET: {{ .Values.env.JWT_SECRET | b64enc | quote }}
